
background {
    monitor =
    path = /home/devix/Pictures/wallpapers/nebula.jpg
    blur_passes = 4
    blur_size = 8
    noise = 0.02
    contrast = 0.9
    brightness = 0.6
    vignette = 0.4
    color = rgba(11111b88)

    dynamic_range = false
}

input-field {
    monitor =
    size = 450, 60
    outline_thickness = 3
    dots_size = 0.3
    dots_spacing = 0.2
    dots_center = true
    dots_rounding = -1
    outer_padding = 0
    placeholder_text = <span foreground="##CDD6F4">Password...</span>
    hide_input = false
    rounding = 14
    position = 0, -120
    halign = center
    valign = center
    font_color = rgb(CDD6F4)
    fade_on_empty = false
    fade_timeout = 1000
    placeholder_color = rgb(6C7086)
    fail_color = rgb(F38BA8)
    fail_text = <i>Authentication failed</i>
    fail_transition = 300
    capslock_color = rgb(F9E2AF)
    numlock_color = rgb(F9E2AF)
    bothlock_color = rgb(F9E2AF)
    invert_numlock = false
    swap_font_color = rgb(CDD6F4)
    check_color = rgb(A6E3A1)
    done_color = rgb(A6E3A1)
}

label {
    monitor =
    text = cmd[update:1000] echo "$TIME"
    color = rgb(CDD6F4)
    font_size = 128
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
    shadow_color = rgba(0,0,0,0.5)
    shadow_passes = 3
}

label {
    monitor =
    text = Hello, <span foreground="##89B4FA">$USER</span>
    color = rgb(CDD6F4)
    font_size = 36
    font_family = JetBrainsMono Nerd Font
    position = 0, 30
    halign = center
    valign = center
}

label {
    monitor =
    text = $ATIBINDS
    color = rgb(6C7086)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date "+%A, %B %d, %Y"
    color = rgb(CDD6F4)
    font_size = 28
    font_family = JetBrainsMono Nerd Font
    position = 0, -40
    halign = center
    valign = center
}
